# Fine-grained candles, for "candles for coin X between timestamp A and B"
# queries (the historical chart). Reads from silver.silver_candles, NOT
# bronze_candles directly -- silver is already deduped to one row per
# (coin_id, interval, open_time), see gold/dataform's own model files for why
# that matters.
cubes:
  - name: candles
    sql_table: silver.silver_candles

    dimensions:
      - name: coin_id
        sql: coin_id
        type: string
        primary_key: true
        public: true

      - name: interval
        sql: "{CUBE}.`interval`"
        type: string

      - name: is_closed
        sql: is_closed
        type: boolean

      - name: open_time
        sql: open_time
        type: time
        primary_key: true
        public: true

      - name: close_time
        sql: close_time
        type: time

    measures:
      - name: count
        type: count

      - name: open
        sql: open
        type: max
        description: >-
          type: max (not avg) is deliberate: Cube's pre-aggregation planner
          treats any avg-type measure as non-additive and refuses to serve
          it from a rollup at all, even one that has the measure -- avg
          can't be safely combined across pre-agg partitions without also
          tracking the count. max IS additive-safe, and since
          silver_candles has exactly one row per (coin_id, interval,
          open_time), max(open) over a single row equals that row's open,
          so this is numerically identical to avg() here. This only holds
          because of that one-row-per-hour invariant -- never query this at
          a coarser granularity than hour directly, or reuse this pattern
          somewhere that invariant doesn't hold. Callers needing daily+
          candles must fetch at hour granularity and bucket client-side
          using the first hour's open per day instead.

      - name: high
        sql: high
        type: max

      - name: low
        sql: low
        type: min

      - name: close
        sql: close
        type: max
        description: >-
          Same reasoning as open: type: max instead of avg so Cube's
          rollup planner treats this as additive and will actually serve
          it from the pre-aggregation. Only correct at hour granularity
          (one row per bucket). Daily close must be the last hour's close
          in that day, computed client-side -- not an aggregate over the
          day's hours.

      - name: volume
        sql: volume
        type: sum

      - name: quote_volume
        sql: quote_volume
        type: sum

      - name: trade_count
        sql: trade_count
        type: sum

    # Range queries ("candles for coin X between A and B") are the primary
    # access pattern here, so the pre-aggregation is keyed on exactly that:
    # partitioned by month (matches bronze_candles' own MONTH partitioning,
    # keeps each partition's build small) and indexed by coin_id so a
    # single-coin range scan doesn't touch other coins' pre-agg data.
    pre_aggregations:
      - name: candles_by_coin_and_hour
        measures:
          - CUBE.count
          - CUBE.open
          - CUBE.high
          - CUBE.low
          - CUBE.close
          - CUBE.volume
          - CUBE.quote_volume
          - CUBE.trade_count
        dimensions:
          - CUBE.coin_id
          - CUBE.interval
          - CUBE.is_closed
        time_dimension: CUBE.open_time
        granularity: hour
        partition_granularity: month
        # bronze_candles goes back to 2017 -- building/maintaining monthly
        # partitions for 9 years x 87 coins OOM-crashed the refresh worker
        # on this box (10GB total, refresh worker capped at 512MB). The
        # chart's real access pattern is recent history, not "exact
        # pre-aggregated data from 2017" -- so cap the pre-aggregation's
        # build range. Queries outside this range still work, they just
        # fall back to a direct (uncached) BigQuery query instead of
        # hitting Cube Store.
        # Was 2 years; shrunk to 13 months once the app's chart ranges were
        # finalized at a 1Y max (see app's ChartTimeframe) -- there's no
        # reason to pay to build/store a year of pre-agg data nobody's UI
        # ever requests. The extra month over 1Y is slack for range-edge
        # timing, not a real requirement.
        # BigQuery's TIMESTAMP_SUB doesn't support YEAR/MONTH intervals at
        # all (only DATE_SUB/DATETIME_SUB do, for DATE/DATETIME types) --
        # go through CURRENT_DATE() first, then cast back to TIMESTAMP.
        build_range_start:
          sql: "SELECT TIMESTAMP(DATE_SUB(CURRENT_DATE(), INTERVAL 13 MONTH))"
        build_range_end:
          sql: "SELECT CURRENT_TIMESTAMP()"
        refresh_key:
          every: 5 minutes
        indexes:
          - name: by_coin
            columns:
              - coin_id
