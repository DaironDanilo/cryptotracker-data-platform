# Gold layer hourly rollup -- see daily_candle_metrics.yml's header for the
# same "why Dataform not a materialized view" reasoning; same source
# (dataform/definitions/hourly_candle_metrics.sqlx).
cubes:
  - name: hourly_candle_metrics
    sql_table: gold.hourly_candle_metrics

    dimensions:
      - name: coin_id
        sql: coin_id
        type: string
        primary_key: true
        public: true

      - name: interval
        sql: "{CUBE}.`interval`"
        type: string

      - name: hour
        sql: hour
        type: time
        primary_key: true
        public: true

    measures:
      - name: count
        type: count

      - name: open
        sql: open
        type: avg

      - name: close
        sql: close
        type: avg

      - name: high
        sql: high
        type: max

      - name: low
        sql: low
        type: min

      - name: volume
        sql: volume
        type: sum

      - name: quote_volume
        sql: quote_volume
        type: sum

      - name: trade_count
        sql: trade_count
        type: sum

    pre_aggregations:
      - name: hourly_metrics_by_coin
        measures:
          - CUBE.count
          - CUBE.high
          - CUBE.low
          - CUBE.volume
          - CUBE.quote_volume
          - CUBE.trade_count
        dimensions:
          - CUBE.coin_id
          - CUBE.interval
        time_dimension: CUBE.hour
        granularity: hour
        partition_granularity: month
        refresh_key:
          every: 15 minutes
        indexes:
          - name: by_coin
            columns:
              - coin_id
