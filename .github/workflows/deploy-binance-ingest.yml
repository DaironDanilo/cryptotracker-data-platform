name: Deploy binance-ingest

# Cloud Run *service* (not a Job) -- called by the crypto-ingest-migration
# Workflow via an authenticated identity token, never invoked directly by
# end users. --no-allow-unauthenticated is intentional and preserves that:
# there is no public IAM binding on this service today, and this workflow
# must not silently add one.
on:
  push:
    branches: [main]
    paths:
      - "migration/binance-ingest-function/**"
      - ".github/workflows/deploy-binance-ingest.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-binance-ingest
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        working-directory: migration/binance-ingest-function
        run: |
          IMAGE="us-central1-docker.pkg.dev/gcp-crypto-tracker/cloud-run-source-deploy/binance-ingest:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run service
        run: |
          gcloud run deploy binance-ingest \
            --image="$IMAGE" \
            --region=us-central1 --project=gcp-crypto-tracker \
            --service-account=binance-function-runtime@gcp-crypto-tracker.iam.gserviceaccount.com \
            --memory=512Mi --cpu=1 --max-instances=10 \
            --no-allow-unauthenticated \
            --quiet
