name: Deploy candle-hourly-sync-job

on:
  push:
    branches: [main]
    paths:
      - "recurring/candle-hourly-sync/**"
      - ".github/workflows/deploy-candle-hourly-sync.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-candle-hourly-sync-job
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        working-directory: recurring/candle-hourly-sync
        run: |
          IMAGE="us-central1-docker.pkg.dev/gcp-crypto-tracker/cloud-run-source-deploy/candle-hourly-sync-job:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run Job
        run: |
          gcloud run jobs deploy candle-hourly-sync-job \
            --image="$IMAGE" \
            --region=us-central1 --project=gcp-crypto-tracker \
            --service-account=candle-hourly-sync-runtime@gcp-crypto-tracker.iam.gserviceaccount.com \
            --set-secrets=DATABASE_URL=supabase-database-url:latest \
            --set-env-vars=GCP_PROJECT_ID=gcp-crypto-tracker \
            --memory=512Mi --cpu=1 --task-timeout=280s --max-retries=0 \
            --quiet
